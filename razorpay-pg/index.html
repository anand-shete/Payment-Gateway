<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Razorpay Payment</title>
  </head>
  <body>
    <h1>Razorpay Payment Gateway Integration</h1>
    <form id="payment-form">
      <label for="amount">Amount:</label>
      <input type="number" id="amount" name="amount" required min="0" />
      <br />
      <br />
      <button type="button" onclick="payNow()">Pay Now</button>
    </form>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      const payNow = async () => {
        // 1. create order ID from server
        const response = await fetch("http://localhost:3000/create-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount: document.getElementById("amount").value,
            currency: "INR",
            receipt: "receipt##1",
            notes: { new: "note: test appplication" },
          }),
        });

        const order = await response.json();

        // TODO add gpay?
        // 2. pass order details to checkout (razorpay)
        const rzp = new Razorpay({
          key: "rzp_test_Thkmm5wvasoRq6",
          amount: order.amount,
          currency: order.currency,
          name: "Your Company Name",
          description: "Test Transaction",
          order_id: order.id,
          prefill: {
            name: "Your Name",
            email: "your.email@example.com",
            contact: "9999999999",
          },
          // theme: { color: "##F37254" },

          // 4. execute handler on payment success
          handler: async (response) => {
            try {
              const result = await fetch("http://localhost:3000/verify-payment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  razorpay_order_id: response.razorpay_order_id,
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_signature: response.razorpay_signature,
                }),
              });

              const data = await result.json();

              // 6. redirect client
              if (data.status !== "ok") alert("Payment verification failed");
              else window.location.href = "/payment-success";
            } catch (error) {
              console.error("Error in : ", error);
              alert("Error verifying payment");
            }
          },
        });

        // 3. open razorpay checkout modal
        rzp.open();
      };
    </script>
  </body>
</html>
